<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新锐纪元企划</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="particles"></canvas>

<nav>
  <div class="logo">新锐纪元 · NEW ERA</div>
  <ul>
    <li><a href="#hero">首页</a></li>
    <li><a href="#story">故事</a></li>
    <li><a href="#world">世界观</a></li>
    <li><a href="#characters">角色</a></li>
    <li><a href="#villains">阴影</a></li>
    <li><a href="#videos">企划视频</a></li>
    <li><a href="#community">加入我们</a></li>

  </ul>
</nav>

<section class="hero" id="hero">
  <div class="hero-content">
    <div class="subtitle" id="hero-subtitle"></div>
    <h1 id="hero-title"></h1>
    <div class="declaration" id="hero-declaration"></div>
  </div>
  <div class="scroll-hint">↓ 向下滚动探索</div>
</section>

<section id="story">
  <div class="section-title">故事缘起</div>
  <div class="section-subtitle">来自作者的自述</div>
  <div id="story-content" class="long-text"></div>
</section>

<section id="world">
  <div class="section-title">三纪元世界观</div>
  <div class="section-subtitle">拖动时间轴，或点击节点切换</div>
  <div class="timeline-wrap">
    <div class="timeline-track" id="timeline-track"></div>
    <div class="timeline-line"></div>
  </div>
  <div class="era-content" id="era-content"></div>
</section>

<section id="characters">
  <div class="section-title">林小队人物志</div>
  <div class="section-subtitle">点击卡片查看完整档案</div>
  <div class="characters-grid" id="characters-grid"></div>
</section>

<section id="videos">
  <div class="section-title">企划视频</div>
  <div class="section-subtitle">PROJECT VIDEOS</div>
  <div class="video-player-wrap">
    <div id="video-player"></div>
  </div>
  <div class="video-list" id="video-list"></div>
</section>

<section id="community">
  <div class="section-title">加入我们</div>
  <div class="section-subtitle">JOIN US</div>
  <div class="community-cards">
    <div class="community-card">
      <div class="card-icon">💰</div>
      <h3 id="comm-wechat-title">支持众筹</h3>
      <div class="qr-placeholder" id="comm-wechat-qr">
        <div class="qr-hint">请在管理后台上传微信收款码</div>
      </div>
      <p class="community-desc" id="comm-wechat-desc">扫码支持新锐纪元企划</p>
    </div>
    <div class="community-card">
      <div class="card-icon">💬</div>
      <h3 id="comm-qq-title">加入社群</h3>
      <div class="qr-placeholder" id="comm-qq-qr">
        <div class="qr-hint">请在管理后台上传QQ群二维码</div>
      </div>
      <p class="qq-number">群号：<span id="comm-qq-num">—</span></p>
      <p class="community-desc" id="comm-qq-desc">一起探索新锐纪元的世界</p>
    </div>
  </div>
</section>



<section id="villains">
  <div class="section-title">暗影面</div>
  <div class="section-subtitle">潜伏的敌人</div>
  <div id="villains-content"></div>
</section>

<footer>© 新锐纪元企划 · 作者 和平莱茵兔 · <a href="admin.html" style="color:var(--text-dim)">管理入口</a></footer>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-left">
      <div class="portrait-large" id="modal-portrait"></div>
      <div class="gallery-thumbs" id="gallery-thumbs"></div>
    </div>
    <div class="details" id="modal-details"></div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>

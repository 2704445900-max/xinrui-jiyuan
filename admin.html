<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 新锐纪元</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-bg" id="login-bg">
  <div class="login-box">
    <h2>管理员登录</h2>
    <p style="color:var(--text-dim);margin:0.5rem 0 1.5rem">请输入密码以继续</p>
    <input type="password" id="login-pwd" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()" style="width:100%;margin-top:1rem">进入</button>
    <p style="color:var(--text-dim);font-size:0.8rem;margin-top:1rem">默认密码：admin123（在 js/admin.js 顶部可改）</p>
  </div>
</div>

<div class="admin-panel" id="admin-panel">
  <div class="admin-header">
    <h2>管理后台</h2>
    <div class="header-actions">
      <a href="index.html" class="btn btn-ghost">👁 预览网页</a>
      <button class="btn btn-ghost" onclick="exportData()">⬇ 导出备份</button>
      <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()">⬆ 导入备份</button>
      <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
      <button class="btn btn-primary" onclick="saveAll()">💾 保存全部</button>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="admin-content" id="admin-content"></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图片提取工具</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f5f5f7;}
  h1{color:#333;}
  .box{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.08);}
  button{background:#0071e3;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:5px;}
  button:hover{background:#0077ed;}
  button:disabled{background:#999;cursor:not-allowed;}
  input[type=file]{padding:10px;border:2px dashed #ccc;border-radius:8px;width:100%;cursor:pointer;}
  .log{background:#1e1e1e;color:#0f0;padding:16px;border-radius:8px;font-family:monospace;font-size:13px;max-height:400px;overflow-y:auto;white-space:pre-wrap;}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0;}
  .stat-item{background:#f0f7ff;padding:12px;border-radius:8px;text-align:center;}
  .stat-num{font-size:24px;font-weight:bold;color:#0071e3;}
  .stat-label{font-size:13px;color:#666;}
  .success{color:#34c759;font-weight:bold;}
  .error{color:#ff3b30;font-weight:bold;}
</style>
</head>
<body>

<h1>🚀 图片自动提取工具</h1>

<div class="box">
  <h3>第 1 步：上传你的 content.json</h3>
  <input type="file" id="fileInput" accept=".json">
</div>

<div class="box" id="statBox" style="display:none;">
  <h3>📊 扫描结果</h3>
  <div class="stat" id="stats"></div>
  <button id="extractBtn">📦 提取图片并下载 ZIP</button>
  <button id="newJsonBtn">📄 下载新的 content.json</button>
</div>

<div class="box">
  <h3>📋 操作日志</h3>
  <div class="log" id="log">等待上传文件...</div>
</div>

<div class="box">
  <h3>📖 使用说明</h3>
  <ol>
    <li>上传当前的 <code>content.json</code> 文件</li>
    <li>点击「提取图片并下载 ZIP」，会下载一个 zip 包</li>
    <li>解压 zip，得到 <code>characters/</code>、<code>villains/</code>、<code>qr/</code> 等文件夹</li>
    <li>把这些文件夹里的图片复制到项目的 <code>images/</code> 对应文件夹下</li>
    <li>点击「下载新的 content.json」</li>
    <li>用新文件覆盖项目里的 <code>data/content.json</code></li>
    <li>测试网页 → 推送到 GitHub</li>
  </ol>
</div>

<script>
let originalData = null;
let newData = null;
let extractedImages = []; // {folder, filename, base64}

const log = document.getElementById('log');
const fileInput = document.getElementById('fileInput');
const statBox = document.getElementById('statBox');
const stats = document.getElementById('stats');

function addLog(msg, type){
  const time = new Date().toLocaleTimeString();
  const cls = type==='success'?'success':type==='error'?'error':'';
  log.innerHTML += `\n[${time}] <span class="${cls}">${msg}</span>`;
  log.scrollTop = log.scrollHeight;
}

// 根据 key 路径推断图片应该放哪个文件夹
function guessFolder(keyPath){
  const path = keyPath.toLowerCase();
  if(path.includes('character')) return 'characters';
  if(path.includes('villain')) return 'villains';
  if(path.includes('era')) return 'eras';
  if(path.includes('qr')||path.includes('wechat')||path.includes('alipay')||path.includes('qq')) return 'qr';
  return 'misc';
}

// 从 base64 提取扩展名
function getExtFromBase64(b64){
  const m = b64.match(/^data:image\/(\w+);base64,/);
  return m ? (m[1]==='jpeg'?'jpg':m[1]) : 'png';
}

// 递归扫描对象，找到所有 base64 图片
function scanForImages(obj, keyPath, results){
  if(obj==null) return;
  if(typeof obj==='string'){
    if(obj.startsWith('data:image/')){
      results.push({keyPath, base64: obj});
    }
    return;
  }
  if(Array.isArray(obj)){
    obj.forEach((item,i)=>scanForImages(item, keyPath+'['+i+']', results));
    return;
  }
  if(typeof obj==='object'){
    Object.keys(obj).forEach(k=>scanForImages(obj[k], keyPath?keyPath+'.'+k:k, results));
  }
}

// 替换对象里的 base64 为路径
function replaceImages(obj, replaceMap, keyPath){
  if(obj==null) return obj;
  if(typeof obj==='string'){
    if(obj.startsWith('data:image/') && replaceMap[keyPath]){
      return replaceMap[keyPath];
    }
    return obj;
  }
  if(Array.isArray(obj)){
    return obj.map((item,i)=>replaceImages(item, replaceMap, keyPath+'['+i+']'));
  }
  if(typeof obj==='object'){
    const res = {};
    Object.keys(obj).forEach(k=>{
      res[k] = replaceImages(obj[k], replaceMap, keyPath?keyPath+'.'+k:k);
    });
    return res;
  }
  return obj;
}

fileInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  
  log.innerHTML = '';
  addLog('📂 读取文件: '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)');
  
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      originalData = JSON.parse(ev.target.result);
      addLog('✅ JSON 解析成功', 'success');
      
      // 扫描所有图片
      const found = [];
      scanForImages(originalData, '', found);
      addLog('🔍 发现 '+found.length+' 张 base64 图片');
      
      // 按文件夹分类
      const counter = {};
      const replaceMap = {};
      extractedImages = [];
      
      found.forEach(item=>{
        const folder = guessFolder(item.keyPath);
        counter[folder] = (counter[folder]||0)+1;
        const idx = counter[folder];
        const ext = getExtFromBase64(item.base64);
        
        // 命名规则
        let filename;
        if(folder==='qr'){
          if(item.keyPath.toLowerCase().includes('wechat')) filename = 'wechat.'+ext;
          else if(item.keyPath.toLowerCase().includes('alipay')) filename = 'alipay.'+ext;
          else if(item.keyPath.toLowerCase().includes('qq')) filename = 'qq.'+ext;
          else filename = 'qr-'+idx+'.'+ext;
        } else {
          const prefix = folder.replace(/s$/,''); // characters → character
          filename = prefix+'-'+idx+'.'+ext;
        }
        
        const path = 'images/'+folder+'/'+filename;
        replaceMap[item.keyPath] = path;
        extractedImages.push({folder, filename, base64: item.base64, keyPath: item.keyPath});
        
        addLog('  → '+item.keyPath+' → '+path);
      });
      
      // 生成新数据
      newData = replaceImages(originalData, replaceMap, '');
      
      // 显示统计
      stats.innerHTML = '';
      Object.keys(counter).forEach(k=>{
        stats.innerHTML += '<div class="stat-item"><div class="stat-num">'+counter[k]+'</div><div class="stat-label">'+k+'/</div></div>';
      });
      
      // 计算大小
      const oldSize = (file.size/1024/1024).toFixed(2);
      const newSize = (new Blob([JSON.stringify(newData)]).size/1024).toFixed(2);
      stats.innerHTML += '<div class="stat-item" style="background:#fff0f0;"><div class="stat-num">'+oldSize+' MB</div><div class="stat-label">原文件</div></div>';
      stats.innerHTML += '<div class="stat-item" style="background:#f0fff0;"><div class="stat-num">'+newSize+' KB</div><div class="stat-label">新文件</div></div>';
      
      statBox.style.display = 'block';
      addLog('✅ 扫描完成，可以点击下方按钮下载', 'success');
      
    }catch(err){
      addLog('❌ 解析失败：'+err.message, 'error');
    }
  };
  reader.readAsText(file);
});

document.getElementById('extractBtn').addEventListener('click', async ()=>{
  if(extractedImages.length===0){
    addLog('❌ 没有可提取的图片', 'error');
    return;
  }
  
  addLog('📦 正在打包 ZIP...');
  const zip = new JSZip();
  
  for(const img of extractedImages){
    const folder = zip.folder(img.folder);
    // base64 → 二进制
    const b64data = img.base64.replace(/^data:image\/\w+;base64,/, '');
    folder.file(img.filename, b64data, {base64: true});
  }
  
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'images.zip';
  a.click();
  URL.revokeObjectURL(url);
  addLog('✅ ZIP 已下载！解压后把里面的文件夹复制到项目 images/ 下', 'success');
});

document.getElementById('newJsonBtn').addEventListener('click', ()=>{
  if(!newData){
    addLog('❌ 请先上传文件', 'error');
    return;
  }
  const blob = new Blob([JSON.stringify(newData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'content.json';
  a.click();
  URL.revokeObjectURL(url);
  addLog('✅ 新 content.json 已下载！替换项目里 data/content.json', 'success');
});
</script>

</body>
</html>
